name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Python ${{ matrix.python-version }} on Linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Verify installed CLI
        run: secret-guard --version
      - name: Run tests
        run: python -m unittest -v
      - name: Compile
        run: python -m py_compile secret_guard.py
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Self-scan committed tree
        run: |
          tmp=$(mktemp -d)
          git archive --format=tar HEAD | tar -x -C "$tmp"
          cd "$tmp"
          git init -q
          git add -A
          env -u NVIDIA_API_KEY python3 secret_guard.py scan --no-ai

  cross-platform:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Verify installed CLI
        run: secret-guard --version
      - name: Run tests
        run: python -m unittest -v
